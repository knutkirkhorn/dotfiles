name: CI
on:
  - push
  - pull_request
jobs:
  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shell lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Bash syntax check and ShellCheck
        run: |
          shopt -s nullglob
          files=(
            .aliases
            .bash_profile
            .functions
            bootstrap.sh
            brew-update.sh
            macos.sh
            test.sh
            npm/*.sh
            tests/*.sh
            macos/*.sh
            macos/*/*.sh
            raycast/*.sh
            scripts/*.sh
          )
          for file in "${files[@]}"; do
            bash -n "$file"
          done
          shellcheck "${files[@]}"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install package managers
        run: npm install -g pnpm yarn bun
      - name: Run tests
        run: bash test.sh

  lint-launchd:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint launchd plists
        run: plutil -lint scripts/launchd/*.plist

  lint-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun lint
      - run: bun format:check
